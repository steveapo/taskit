<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks · Taskit</title>
  <meta name="description" content="Add, edit and track the tasks you hand to Taskit's AI agents. Search, filter and sort by status, priority, agent or due date.">
  <meta name="author" content="Stavros Apostolou">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header id="site-header"></header>

  <main id="main" class="flex-grow-1">
    <div class="container py-4">
      <h1 class="h2 mb-4">Your tasks</h1>

      <!-- Summary: filled in by js/tasks.js -->
      <section class="row g-3 mb-4" aria-label="Task summary">
        <div class="col-4"><div class="card text-center h-100"><div class="card-body py-3">
          <div class="fs-2 fw-bold" id="count-total">0</div><div class="small text-body-secondary">Total</div>
        </div></div></div>
        <div class="col-4"><div class="card text-center h-100"><div class="card-body py-3">
          <div class="fs-2 fw-bold text-warning-emphasis" id="count-pending">0</div><div class="small text-body-secondary">Pending</div>
        </div></div></div>
        <div class="col-4"><div class="card text-center h-100"><div class="card-body py-3">
          <div class="fs-2 fw-bold text-success-emphasis" id="count-done">0</div><div class="small text-body-secondary">Completed</div>
        </div></div></div>
      </section>

      <!-- Add / edit form (the same form is reused for editing) -->
      <section class="card mb-4 shadow-sm" aria-labelledby="form-heading">
        <div class="card-body">
          <h2 id="form-heading" class="h5 mb-3">Add a task</h2>
          <form id="task-form" novalidate>
            <input type="hidden" id="task-id">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="task-name" class="form-label">Task name</label>
                <input type="text" id="task-name" class="form-control" required maxlength="80" autocomplete="off">
                <div class="invalid-feedback">Give the task a name.</div>
              </div>
              <div class="col-6 col-md-3">
                <label for="task-due" class="form-label">Due date</label>
                <input type="date" id="task-due" class="form-control" required>
                <div class="invalid-feedback">Pick a due date.</div>
              </div>
              <div class="col-6 col-md-3">
                <label for="task-priority" class="form-label">Priority</label>
                <select id="task-priority" class="form-select">
                  <option value="high">High</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <div class="col-md-9">
                <label for="task-description" class="form-label">Description</label>
                <textarea id="task-description" class="form-control" rows="2" required maxlength="300"></textarea>
                <div class="invalid-feedback">Describe what the agent should do.</div>
              </div>
              <div class="col-md-3">
                <label for="task-agent" class="form-label">Agent</label>
                <select id="task-agent" class="form-select"></select>
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button type="submit" id="task-submit" class="btn btn-brand">Add task</button>
              <button type="button" id="task-cancel" class="btn btn-outline-secondary d-none">Cancel</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Toolbar: live search, filters and sorting -->
      <section aria-labelledby="list-heading">
        <h2 id="list-heading" class="visually-hidden">Task list</h2>
        <div class="row g-2 mb-3" role="search">
          <div class="col-12 col-lg-4">
            <label for="search" class="visually-hidden">Search tasks</label>
            <input type="search" id="search" class="form-control" placeholder="Search by name or description…">
          </div>
          <div class="col-6 col-lg-2">
            <label for="filter-status" class="visually-hidden">Filter by status</label>
            <select id="filter-status" class="form-select">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="filter-priority" class="visually-hidden">Filter by priority</label>
            <select id="filter-priority" class="form-select">
              <option value="all">All priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="filter-agent" class="visually-hidden">Filter by agent</label>
            <select id="filter-agent" class="form-select">
              <option value="all">All agents</option>
            </select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="sort" class="visually-hidden">Sort tasks</label>
            <select id="sort" class="form-select">
              <option value="due-asc">Due date (soonest)</option>
              <option value="due-desc">Due date (latest)</option>
              <option value="name">Name (A–Z)</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle">
            <caption id="table-caption" class="small"></caption>
            <thead>
              <tr>
                <th scope="col">Task</th>
                <th scope="col">Description</th>
                <th scope="col">Agent</th>
                <th scope="col">Due date</th>
                <th scope="col">Priority</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="task-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- Latest activity: drawn by js/activity.js from the store's activity log -->
      <section class="mt-5" aria-labelledby="activity-heading">
        <h2 id="activity-heading" class="lede mb-3">
          <span>Latest activity.</span>
          <span class="lede-muted">Everything your agents did, newest first.</span>
        </h2>
        <!-- Only this line is a live region (not the list), so screen readers hear the newest entry, not the whole list again. -->
        <p id="activity-status" class="visually-hidden" aria-live="polite"></p>
        <div class="panel">
          <ul id="activity-list" class="row-list"></ul>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/store.js"></script>
  <script src="js/agent-sim.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
