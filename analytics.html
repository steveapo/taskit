<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · Taskit</title>
  <meta name="description" content="See how your agents are doing: completed vs pending tasks, a priority breakdown, and a drag-and-drop Kanban board.">
  <meta name="author" content="Stavros Apostolou">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header id="site-header"></header>

  <main id="main" class="flex-grow-1">
    <div class="container py-4">
      <h1 class="h2 mb-4">Analytics</h1>

      <!-- Charts: drawn with plain CSS by js/analytics.js -->
      <div class="row g-4 mb-5">
        <section class="col-md-6" aria-labelledby="bar-heading">
          <div class="card h-100 shadow-sm"><div class="card-body">
            <h2 id="bar-heading" class="h5">Completed vs pending</h2>
            <div id="bar-chart" class="bar-chart mt-4" role="img"></div>
            <div id="bar-labels" class="bar-labels mt-2 small"></div>
          </div></div>
        </section>
        <section class="col-md-6" aria-labelledby="pie-heading">
          <div class="card h-100 shadow-sm"><div class="card-body">
            <h2 id="pie-heading" class="h5">Tasks by priority</h2>
            <div class="d-flex flex-wrap align-items-center justify-content-center gap-4 mt-4">
              <div id="pie-chart" class="pie-chart" role="img"></div>
              <ul id="pie-legend" class="list-unstyled mb-0"></ul>
            </div>
          </div></div>
        </section>
      </div>

      <!-- Kanban board: columns are generated by js/analytics.js -->
      <section aria-labelledby="board-heading">
        <h2 id="board-heading" class="h4">Kanban board</h2>
        <p class="text-body-secondary small">Drag cards between columns, or use the menu on each card to move it.</p>
        <div id="board" class="row g-3"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/store.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
