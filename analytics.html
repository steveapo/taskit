<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · Taskit</title>
  <meta name="description" content="See how your agents are doing: completed vs pending tasks, a priority breakdown, and a drag-and-drop Kanban board.">
  <meta name="author" content="Stavros Apostolou">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header id="site-header"></header>

  <main id="main" class="flex-grow-1">
    <div class="container pt-5 pb-4">
      <!-- Page heading in two tones, then the three counts (filled in by js/analytics.js) -->
      <h1 class="lede mb-4 pt-lg-4">
        <span>Analytics.</span>
        <span class="lede-muted">Where every task stands.</span>
      </h1>
      <dl class="stat-strip" aria-label="Task summary">
        <div class="stat"><dt class="label">Total</dt><dd id="count-total" class="stat-value mono">0</dd></div>
        <div class="stat"><dt class="label">Pending</dt><dd id="count-pending" class="stat-value mono">0</dd></div>
        <div class="stat"><dt class="label">Completed</dt><dd id="count-done" class="stat-value mono">0</dd></div>
      </dl>

      <!-- Charts: plain HTML and CSS, drawn by js/analytics.js. Side by side from 992px. -->
      <div class="row g-3 mt-4">
        <div class="col-lg-6">
          <section class="panel" aria-labelledby="bar-heading">
            <h2 id="bar-heading" class="panel-title">Completed vs pending</h2>
            <p class="panel-text">How much of the work is finished.</p>
            <div id="bar-chart" class="hbars" role="img"></div>
          </section>
        </div>
        <div class="col-lg-6">
          <section class="panel" aria-labelledby="priority-heading">
            <h2 id="priority-heading" class="panel-title">By priority</h2>
            <p class="panel-text">How urgent the work is.</p>
            <div id="priority-bar" class="seg-bar" role="img"></div>
            <ul id="priority-legend" class="legend"></ul>
          </section>
        </div>
      </div>

      <!-- Kanban board: the three columns are generated by js/analytics.js -->
      <section class="section pb-0" aria-labelledby="board-heading">
        <h2 id="board-heading" class="lede mb-4">
          <span>Kanban board.</span>
          <span class="lede-muted">Drag a card to another column, or pick one from its menu.</span>
        </h2>
        <div id="board" class="board"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
