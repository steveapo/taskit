<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents · Taskit</title>
  <meta name="description" content="Meet Taskit's four AI agents, Athena, Hermes, Pythagoras and Hephaestus, and see their skills and live workload.">
  <meta name="author" content="Stavros Apostolou">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header id="site-header"></header>

  <main id="main" class="flex-grow-1">
    <div class="container py-4">
      <h1 class="h2">Meet the agents</h1>
      <p class="lead">Four specialists, each named after a figure from Ancient Greece. Give each task to the agent whose skills fit best. Hover over or focus on a skill to see what it covers.</p>
      <!-- One card per agent, rendered by js/agents.js from the store -->
      <div id="agent-grid" class="row row-cols-1 row-cols-md-2 g-4 mt-1"></div>

      <!-- "Agent thought of the day": the quote from the public API, loaded by js/quote.js -->
      <section class="panel quote-panel mt-5" aria-labelledby="quote-heading">
        <h2 id="quote-heading" class="label mb-0">Agent thought of the day</h2>
        <div id="quote" aria-live="polite"></div>
        <button id="new-quote" type="button" class="link-arrow">New thought <span data-icon="arrow-path"></span></button>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/store.js"></script>
  <script src="js/quote.js"></script>
  <script src="js/agents.js"></script>
</body>
</html>
