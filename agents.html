<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents · Taskit</title>
  <meta name="description" content="Meet Taskit's four AI agents, Athena, Hermes, Pythagoras and Hephaestus, and see their skills and live workload.">
  <meta name="author" content="Stavros Apostolou">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header id="site-header"></header>

  <main id="main" class="flex-grow-1">
    <div class="container pt-5 pb-4">
      <!-- Page heading in two tones, like the other app pages -->
      <h1 class="lede mb-4 pt-lg-4">
        <span>Meet the agents.</span>
        <span class="lede-muted">Four specialists, named after figures from Ancient Greece.</span>
      </h1>
      <!-- One panel per agent (2 × 2 from 768px), drawn by js/agents.js from the store.
           This page's own Bootstrap components: progress bars, tooltips and a list group. -->
      <div id="agent-grid" class="row g-3"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/store.js"></script>
  <script src="js/agents.js"></script>
</body>
</html>
